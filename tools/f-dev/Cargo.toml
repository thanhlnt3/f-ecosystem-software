[package]
name = "f-dev"
description = "CLI cho nhà phát triển F-Eco: kiểm tra f-app.toml và nộp phiên bản (f-dev publish)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
feco-manifest = { path = "../../crates/feco-manifest" }
tokio = { workspace = true, features = ["fs"] }
serde_json.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
sha2 = "0.11.0"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true
