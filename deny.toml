# Kiểm tra phụ thuộc Rust (tasks.md 1.2, 1.3). Danh sách license khớp spec
# dependency-licensing; license khác phải có ngoại lệ đã duyệt trong
# third_party/license-exceptions.toml và được thêm vào [[licenses.exceptions]] bên dưới.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "OFL-1.1",
    "CC0-1.0",
    "MPL-2.0",
    "PostgreSQL",
]

[advisories]
# Lỗ hổng đã biết trong phụ thuộc làm CI thất bại (platform-security, "Kiểm thử bảo mật").
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
