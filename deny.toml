# Kiểm tra phụ thuộc Rust (tasks.md 1.2, 1.3). Danh sách license khớp spec
# dependency-licensing; license khác phải có ngoại lệ đã duyệt trong
# third_party/license-exceptions.toml và được thêm vào [[licenses.exceptions]] bên dưới.

[graph]
all-features = true
# Chỉ kiểm các nền tảng thật sự phát hành: launcher và app mẫu cho Windows, macOS; dịch vụ cho
# Linux. Không có nền tảng wasm32/android nên các crate chỉ dùng ở đó không đi vào sản phẩm.
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "OFL-1.1",
    "CC0-1.0",
    "MPL-2.0",
    "PostgreSQL",
    "0BSD",
]

[advisories]
# Lỗ hổng đã biết trong phụ thuộc làm CI thất bại (platform-security, "Kiểm thử bảo mật").
yanked = "deny"
ignore = [
    # basic-toml chỉ chạy lúc biên dịch, trong askama_derive, để đọc askama.toml (dự án
    # không có file này). Đây là cảnh báo "ngừng bảo trì", không phải lỗ hổng. Gỡ khi
    # askama bỏ phụ thuộc này. Người duyệt: chủ dự án, 2026-11-09.
    { id = "RUSTSEC-2026-0374", reason = "basic-toml chỉ dùng lúc biên dịch trong askama_derive" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
