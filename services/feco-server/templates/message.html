{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
{% for m in messages %}<div class="msg {{ m.kind }}" role="status">{{ m.text }}</div>{% endfor %}
<div class="links">
  {% for (href, label) in links %}<a href="{{ href }}">{{ label }}</a>{% endfor %}
</div>
{% endblock %}
