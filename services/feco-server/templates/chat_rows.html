{% for r in rows %}<div class="chat-msg {{ r.side }}{% if r.mine %} mine{% endif %}" id="m{{ r.id }}" data-id="{{ r.id }}" data-side="{{ r.side }}"><div class="chat-meta"><strong>{{ r.who }}</strong> <span class="muted">{{ r.at }}</span></div><div class="chat-body">{{ r.body }}</div>{% match r.att %}{% when Some with (a) %}<div class="chat-att" data-status="{{ a.status }}">{% if a.ready %}<a href="{{ a.url }}" download>{{ a.name }}</a>{% else %}<span>{{ a.name }}</span> · <span class="att-status">{{ i18n.t(a.label) }}</span>{% endif %} <span class="muted">{{ a.size }}</span></div>{% when None %}{% endmatch %}</div>
{% endfor %}
