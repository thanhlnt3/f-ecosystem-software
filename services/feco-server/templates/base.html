<!doctype html>
<html lang="{{ i18n.code() }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}F-Eco{% endblock %} · F-Eco</title>
<style>
  :root { --radius:6px; --card-radius:10px; --stroke:1px; --scale:1; --pad:24px; --gap:12px; }
  html { font-size:calc(16px * var(--scale)); }
  :root[data-density=compact] { --pad:14px; --gap:8px; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:1rem/1.55 system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans","Noto Sans CJK JP",Roboto,sans-serif; }
  .topbar { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:20px; padding:10px 24px; background:var(--panel); border-bottom:var(--stroke) solid var(--line); }
  .topbar .brand { display:flex; align-items:center; gap:8px; font-weight:700; letter-spacing:.02em; color:var(--fg); text-decoration:none; }
  .logo { display:inline-grid; place-items:center; width:28px; height:28px; border-radius:var(--radius); background:var(--accent); color:var(--on-accent); font-weight:800; }
  .mainnav { display:flex; gap:4px; flex-wrap:wrap; flex:1; }
  .mainnav a, .tools a { color:var(--fg); text-decoration:none; padding:6px 10px; border-radius:var(--radius); font-size:.95rem; }
  .mainnav a:hover, .tools a:hover { background:var(--card); }
  .tools { display:flex; align-items:center; gap:6px; }
  .langs { display:flex; border:var(--stroke) solid var(--line); border-radius:var(--radius); overflow:hidden; }
  .langs a { border-radius:0; padding:4px 9px; font-size:.85rem; }
  .langs a[aria-current] { background:var(--accent); color:var(--on-accent); }
  .motif { height:4px; background:var(--motif, transparent); }
  main { max-width:520px; margin:40px auto; padding:0 16px; }
  main.wide { max-width:960px; }
  .card { background:var(--card); border:var(--stroke) solid var(--line); border-radius:var(--card-radius); padding:var(--pad); box-shadow:0 1px 2px rgb(0 0 0 / 4%); }
  h1 { font-size:1.4rem; margin:0 0 16px; }
  button { margin-top:18px; width:100%; padding:11px; border:0; border-radius:var(--radius); background:var(--accent); color:var(--on-accent); font:inherit; font-weight:600; cursor:pointer; }
  footer.site { text-align:center; color:var(--muted); font-size:.85rem; margin:24px 0 40px; }
  .prefs fieldset { border:var(--stroke) solid var(--line); border-radius:var(--card-radius); padding:12px 16px 16px; margin:16px 0 0; }
  .prefs legend { font-weight:700; padding:0 6px; }
  .prefs label.opt, .prefs label.chip { display:flex; align-items:center; gap:8px; font-weight:400; margin:6px 0; }
  .chips { display:flex; gap:12px; flex-wrap:wrap; }
  .styles { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:var(--gap); margin-top:8px; }
  .style-card { display:flex !important; flex-direction:column; gap:6px; font-weight:400 !important; margin:0 !important; padding:10px; border:var(--stroke) solid var(--line); border-radius:var(--card-radius); cursor:pointer; }
  .style-card:has(input:checked) { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent); }
  .swatch { display:flex; gap:6px; padding:10px; border-radius:var(--radius); border:1px solid rgb(0 0 0 / 12%); }
  .swatch span { width:22px; height:22px; border-radius:50%; border:1px solid rgb(0 0 0 / 15%); }
  .dot { width:14px; height:14px; border-radius:50%; display:inline-block; border:1px solid rgb(0 0 0 / 15%); }
  .cols { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:0 16px; }
  .actions { display:flex; gap:12px; }
  .actions button { width:auto; padding:11px 22px; }
  .msg.warn { color:var(--warn); border-color:currentColor; font-weight:600; }
  .admin-shell { display:grid; grid-template-columns:240px 1fr; min-height:calc(100vh - 60px); }
  .admin-side { background:var(--panel); border-right:var(--stroke) solid var(--line); padding:20px 12px; }
  .admin-who { display:flex; flex-direction:column; gap:2px; padding:0 10px 16px; font-size:.9rem; }
  .admin-side nav { display:flex; flex-direction:column; gap:2px; }
  .admin-side nav a { color:var(--fg); text-decoration:none; padding:8px 10px; border-radius:var(--radius); }
  .admin-side nav a:hover { background:var(--card); }
  .admin-side nav a[aria-current] { background:var(--accent); color:var(--on-accent); font-weight:600; }
  .admin-main { padding:24px 32px; max-width:1200px; width:100%; }
  .admin-main > .card { margin-top:8px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:var(--gap); margin:16px 0; }
  .kpi { display:flex; flex-direction:column; gap:4px; padding:16px; background:var(--card); border:var(--stroke) solid var(--line); border-radius:var(--card-radius); color:var(--fg); text-decoration:none; }
  .kpi:hover { border-color:var(--accent); }
  .kpi.attention { border-left:4px solid var(--warn); }
  .kpi-label { color:var(--muted); font-size:.9rem; }
  .kpi-value { font-size:1.8rem; font-weight:700; line-height:1.2; }
  .kpi-note { color:var(--muted); font-size:.85rem; }
  .chart h2 { margin-top:0; }
  .bars { display:flex; align-items:flex-end; gap:6px; height:180px; padding-top:8px; }
  .bar { flex:1; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:4px; }
  .bar span { display:block; width:100%; min-height:2px; background:var(--accent); border-radius:var(--radius) var(--radius) 0 0; }
  .bar small { color:var(--muted); font-size:.7rem; }
  @media (max-width:800px) { .admin-shell { grid-template-columns:1fr; } .admin-side { border-right:0; border-bottom:var(--stroke) solid var(--line); } .admin-side nav { flex-direction:row; flex-wrap:wrap; } .admin-main { padding:16px; } }
  @media (max-width:640px) { .topbar { flex-wrap:wrap; padding:10px 12px; gap:8px; } .mainnav { order:3; flex-basis:100%; } }
  * { box-sizing:border-box; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; margin-top:16px; }
  .app { border:1px solid var(--line); border-radius:var(--card-radius); padding:14px; }
  .app h3 { margin:0 0 4px; font-size:1.05rem; }
  .badge { display:inline-block; font-size:.8rem; padding:1px 8px; border-radius:999px; border:1px solid currentColor; margin-left:6px; }
  .badge.ok { color:var(--ok); }
  .badge.brand { color:var(--accent); }
  .filters { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .filters input[type=search] { flex:1 1 240px; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius); background:var(--bg); color:var(--fg); font:inherit; }
  .filters select { width:auto; }
  .filters button { width:auto; margin:0; padding:10px 16px; }
  .facts { display:grid; grid-template-columns:max-content 1fr; gap:4px 16px; font-size:.95rem; }
  .shots { display:flex; gap:8px; overflow-x:auto; }
  .shots img { max-height:180px; border-radius:var(--radius); border:1px solid var(--line); }
  .review { border-top:1px solid var(--line); padding:12px 0; }
  .reply { margin:8px 0 0 16px; padding-left:12px; border-left:3px solid var(--accent); }
  textarea { width:100%; min-height:80px; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius); background:var(--bg); color:var(--fg); font:inherit; }
  details { margin-top:8px; }
  .scope.required { font-weight:600; }
  h2 { font-size:1.05rem; margin:22px 0 4px; }
  form + form { border-top:1px solid var(--line); margin-top:22px; }
  label { display:block; font-weight:600; margin:14px 0 6px; }
  input[type=email],input[type=password],input[type=text],input[type=tel],select { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius); background:var(--bg); color:var(--fg); font:inherit; }
  .danger { background:var(--err); }
  button.secondary { background:transparent; color:var(--accent); border:1px solid currentColor; }
  table label { font-weight:600; }
  .msg { padding:10px 12px; border-radius:var(--radius); margin:10px 0; border:1px solid var(--line); }
  .msg.error { color:var(--err); border-color:currentColor; }
  .msg.success { color:var(--ok); border-color:currentColor; }
  .field-msg { font-size:.9rem; margin-top:4px; }
  .field-msg.error { color:var(--err); }
  .links { margin-top:18px; font-size:.95rem; display:flex; gap:16px; flex-wrap:wrap; }
  a { color:var(--accent); }
  .challenge { margin-top:14px; display:flex; gap:8px; align-items:flex-start; }
  .muted { color:var(--muted); }
  img.qr { display:block; margin:12px auto; max-width:200px; background:#fff; padding:8px; border-radius:var(--radius); }
  code { word-break:break-all; }
  ul.codes { columns:2; font-family:ui-monospace,Consolas,monospace; }
  table { width:100%; border-collapse:collapse; font-size:.95rem; }
  #error-codes th, #error-codes td { padding:.4rem .6rem; text-align:left; vertical-align:top; }
  #error-codes td.code { white-space:nowrap; }
  td { padding:10px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  .row-actions { text-align:right; }
  .row-actions button { width:auto; margin:0; padding:6px 10px; background:transparent; color:var(--accent); border:1px solid currentColor; }
</style>
<link rel="stylesheet" href="/ui.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="logo">F</span>F-Eco</a>
  <nav class="mainnav" aria-label="F-Eco">
    <a href="/">{{ i18n.t("nav.account") }}</a>
    <a href="/store">{{ i18n.t("nav.store") }}</a>
    <a href="/orders">{{ i18n.t("nav.orders") }}</a>
    <a href="/notifications">{{ i18n.t("nav.notifications") }}</a>
    <a href="/developer">{{ i18n.t("nav.developer") }}</a>
  </nav>
  <div class="tools">
    <span class="langs" id="lang-switch" role="group" aria-label="{{ i18n.t("prefs.language") }}">
      <a href="/lang/vi" lang="vi" title="Tiếng Việt"{% if i18n.code() == "vi" %} aria-current="true"{% endif %}>VI</a>
      <a href="/lang/en" lang="en" title="English"{% if i18n.code() == "en" %} aria-current="true"{% endif %}>EN</a>
      <a href="/lang/ja" lang="ja" title="日本語"{% if i18n.code() == "ja" %} aria-current="true"{% endif %}>日本語</a>
    </span>
    <a href="/preferences" id="nav-preferences">{{ i18n.t("nav.preferences") }}</a>
  </div>
</header>
<div class="motif" aria-hidden="true"></div>
{% block page %}
<main class="{% block main_class %}{% endblock %}">
  <div class="card">
{% block content %}{% endblock %}
  </div>
</main>
{% endblock %}
<footer class="site">F-Eco</footer>
</body>
</html>
