[package]
name = "feco-server"
description = "Dịch vụ HTTP của F-Eco"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
feco-core.workspace = true
feco-config.workspace = true
axum = { workspace = true, features = ["multipart"] }
tokio = { workspace = true, features = ["time", "fs", "io-util", "sync"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["json", "cookies", "multipart", "rustls"] }
askama = "0.16.1"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "hostname", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }
url.workspace = true
form_urlencoded = "1.2.2"
getrandom = "0.4.3"
humantime = "2.4.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid", "time", "json"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
time = { version = "0.3.45", features = ["serde", "formatting", "parsing", "macros"] }
hmac = "0.13.0"
sha2 = "0.11.0"
base64 = "0.23.1"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
aes-gcm = "0.11.1"
feco-manifest = { path = "../../crates/feco-manifest" }
feco-tuf = { path = "../../crates/feco-tuf" }
semver = "1.0.28"
futures-util = "0.3"
jiff = "0.2"

[dev-dependencies]
tower.workspace = true
http-body-util.workspace = true
scraper = "0.29.0"
regex = "1.13.1"
totp-rs = "5.7.2"
tempfile = "3"
f-dev = { path = "../../tools/f-dev" }
fsdk = { path = "../../sdk/rust" }
aws-lc-rs = "1"
feco-manifest = { path = "../../crates/feco-manifest" }

[lints]
workspace = true
