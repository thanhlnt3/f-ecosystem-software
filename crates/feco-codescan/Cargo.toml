[package]
name = "feco-codescan"
description = "Quét mã nguồn: bí mật lộ, thư viện có lỗ hổng (OSV.dev), mã đáng ngờ, giấy phép (spec source-scan)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "feco-codescan"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["time"] }
regex = "1.13.1"
globset = "0.4.21"
walkdir = "2.5.0"
tempfile = "3"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
axum.workspace = true

[lints]
workspace = true
