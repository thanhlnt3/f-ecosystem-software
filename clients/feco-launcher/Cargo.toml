[package]
name = "feco-launcher"
description = "F-Launcher: đăng nhập một lần, cài, cập nhật, mở và gỡ app con của F-Eco (xác minh bằng TUF)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
feco-core.workspace = true
feco-tuf = { path = "../../crates/feco-tuf" }
tough = { version = "0.24.0", features = ["http"] }
axum.workspace = true
tokio = { workspace = true, features = ["fs", "process", "time", "sync"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
jiff = { version = "0.2", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form"] }
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
sha2 = "0.11.0"
base64 = "0.23.1"
getrandom = "0.4.3"
hex = "0.4"
semver = "1.0.28"
dirs = "7.0.0"
open = "5.4.5"
keyring-core = "1.0.1"
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "wayland", "x11"] }

# Kho bảo mật của hệ điều hành (chỉ Windows và macOS, nền tảng launcher hỗ trợ).
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
