[package]
name = "f-builder"
description = "F-Builder: find out how any software works, then craft your own"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[lints]
workspace = true

[dependencies]
f-builder-engine = { workspace = true }
f-builder-platform = { workspace = true }
f-builder-ai = { workspace = true }
f-builder-setup = { workspace = true }
f-builder-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "persistence"] }
log = { workspace = true }
# The one dialog the app shows itself: when its window can't open, so a start that shows nothing
# still says why (#166).
rfd = { workspace = true }

[features]
wasm-plugins = ["f-builder-engine/wasm-plugins"]

[build-dependencies]
# Icon + VERSIONINFO for f-builder.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
