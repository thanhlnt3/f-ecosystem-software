[package]
name = "f-builder-engines"
description = "Adapters for optional external engines (Ghidra, adb, Chromium, Frida, JADX…) used by F-Builder"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
f-builder-evidence = { workspace = true }
f-builder-platform = { workspace = true }
f-builder-formats = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
# Kho chứng thư của hệ điều hành (platform-verifier), không kèm webpki-roots: license của nó
# (CDLA-Permissive-2.0) không có trong danh sách của F-Eco. `_ring` là nhà cung cấp mật mã mà
# tính năng `rustls` mặc định của ureq vẫn dùng.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier", "gzip"] }
# The same version the engine crate uses (fal.ai sends files as base64 in some answers).
base64 = "0.22"
# The WebSocket handshake of the CDP client.
sha1 = "0.10"
toml = { workspace = true }
# WASM component plugins (R1.8), only with the `wasm-plugins` feature: a large build, so off by
# default. Safe API; no unsafe in our code.
wasmtime = { version = "49", optional = true, default-features = false, features = ["std", "runtime", "cranelift", "component-model", "wat"] }

[features]
wasm-plugins = ["dep:wasmtime"]

[dev-dependencies]
tempfile = "3"
f-builder-testkit = { workspace = true }
