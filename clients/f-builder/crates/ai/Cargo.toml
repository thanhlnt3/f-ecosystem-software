[package]
name = "f-builder-ai"
description = "AI backends, the agent loop and crews for F-Builder"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
schemars = { workspace = true }
f-builder-evidence = { workspace = true }
f-builder-engine = { workspace = true }
f-builder-engines = { workspace = true }
f-builder-formats = { workspace = true }
f-builder-platform = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
toml = { workspace = true }
# Kho chứng thư của hệ điều hành (platform-verifier), không kèm webpki-roots: license của nó
# (CDLA-Permissive-2.0) không có trong danh sách của F-Eco. `_ring` là nhà cung cấp mật mã mà
# tính năng `rustls` mặc định của ureq vẫn dùng.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier", "gzip"] }
dirs = "6"
# Gói và đơn gửi F-Eco (tasks.md 11.6).
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = { workspace = true }
# Trình kiểm tra f-app.toml mà cổng nhà phát triển F-Eco dùng.
feco-manifest = { path = "../../../../crates/feco-manifest" }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
f-builder-testkit = { workspace = true }
