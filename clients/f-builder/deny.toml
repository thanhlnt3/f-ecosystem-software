# cargo-deny cho F-Builder theo chính sách license của F-Eco (spec dependency-licensing).
# Chạy: `cargo deny check` trong clients/f-builder (CI: job f-builder).

[graph]
all-features = true
# F-Eco phát hành F-Builder cho Windows và macOS (giống deny.toml ở gốc repo).
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
yanked = "deny"
ignore = [
    # rsa "Marvin attack": rò khóa riêng qua thời gian khi giải mã hay ký bằng khóa riêng. F-Builder
    # chỉ kiểm chữ ký bằng khóa công khai (crates/formats/src/verify.rs); khóa riêng chỉ có trong
    # test (testkit). Chưa có bản sửa; xem lại khi có rsa 0.10.
    # Người duyệt: chủ dự án (thanhlnt3), 2026-11-11.
    { id = "RUSTSEC-2023-0071", reason = "chỉ kiểm chữ ký bằng khóa công khai; không thao tác với khóa riêng" },
]

[licenses]
# Danh sách cho phép của F-Eco.
allow = [
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "OFL-1.1",
    "CC0-1.0",
    "MPL-2.0",
    "PostgreSQL",
    "0BSD",
]
confidence-threshold = 0.9
exceptions = [
    # Font mặc định của egui, dùng nguyên trạng (chữ Nga, Hy Lạp, mũi tên, emoji). Ngoại lệ đã duyệt
    # trong third_party/license-exceptions.toml ở gốc repo.
    { allow = ["Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
