# Bổ sung cho docker-compose.yml khi chạy E2E (CI, job infra):
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.e2e.yml up -d --wait
# Kratos dùng mạng của máy để gọi được nhà cung cấp OIDC giả mà test chạy ở 127.0.0.1:4499
# (thay đổi oidc-login-and-token-reuse, design T4).
services:
  kratos:
    network_mode: host
    ports: !reset []
    environment:
      COURIER_SMTP_CONNECTION_URI: smtp://127.0.0.1:1025/?disable_starttls=true
    command: >-
      serve --config /etc/config/kratos/kratos.yml
      --config /etc/config/kratos/kratos.e2e-oidc.yml --dev --watch-courier
