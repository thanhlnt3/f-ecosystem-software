# Hạ tầng phát triển của F-Eco (tasks.md 1.4). CHỈ dùng cho máy phát triển và CI:
# mọi mật khẩu và bí mật dưới đây là giá trị giả cho dev, không dùng ở staging/production.
#
#   docker compose -f infra/docker-compose.yml up -d --wait
#
# Mỗi ảnh container phải được khai báo license trong third_party/native.toml
# (feco-license-check kiểm tra điều này trong CI).
name: feco-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: feco
      POSTGRES_PASSWORD: feco-dev-only
      POSTGRES_DB: feco
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feco -d feco"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:8.0-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    # Nhận email của Kratos (xác minh, khôi phục) để xem ở http://127.0.0.1:8025
    image: axllent/mailpit:v1.21
    # 1025: SMTP cho feco-server (email cảnh báo); 8025: giao diện và API xem email.
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  kratos:
    image: oryd/kratos:v1.3.1
    # DSN memory: Kratos tự chạy migration khi khởi động; đủ cho dev và CI.
    environment:
      DSN: memory
    command: serve --config /etc/config/kratos/kratos.yml --dev --watch-courier
    volumes:
      - ./kratos:/etc/config/kratos:ro
    ports: ["127.0.0.1:4433:4433", "127.0.0.1:4434:4434"]
    depends_on: [mailpit]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4433/health/ready || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 60

  hydra:
    image: oryd/hydra:v2.3.0
    environment:
      DSN: memory
    command: serve all --config /etc/config/hydra/hydra.yml --dev
    volumes:
      - ./hydra:/etc/config/hydra:ro
    ports: ["127.0.0.1:4444:4444", "127.0.0.1:4445:4445"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4444/health/ready || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 60
