[package]
name = "fsdk-c"
description = "F-SDK cho C (ABI ổn định) và cho các ngôn ngữ gọi được C, như Python qua ctypes"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "fsdk_c"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
fsdk = { path = "../rust" }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

# Giao diện C cần mã `unsafe` (con trỏ thô); không dùng lint `unsafe_code = "forbid"` của
# workspace, thay bằng các lint buộc ghi rõ lý do an toàn cho từng khối.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"
