[package]
name = "fsdk"
description = "F-SDK: đăng nhập bằng tài khoản F-Eco, đọc dữ liệu người dùng theo scope, kiểm tra quyền sử dụng"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "sync"] }
url.workspace = true
sha2 = "0.11.0"
hmac = "0.13.0"
base64 = "0.23.1"
getrandom = "0.4.3"
open = "5.4.5"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
