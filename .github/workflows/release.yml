name: release

# Đẩy tag v* (ví dụ v1.0.0): dựng bản phát hành cho Windows, Linux, macOS, đóng gói kèm F-SDK,
# tài liệu, THIRD_PARTY_NOTICES và SBOM, rồi tạo bản phát hành NHÁP trên GitHub để chủ dự án xem
# lại trước khi công bố.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dựng bản release
        run: cargo build --release --locked -p feco-launcher -p feco-server -p f-dev -p feco-tuf -p fsdk-c
      - name: Đóng gói (chương trình, F-SDK, tài liệu, notices, SBOM)
        shell: bash
        run: bash scripts/package-release.sh ${{ matrix.target }} target
      - uses: actions/upload-artifact@v4
        with:
          name: feco-${{ matrix.target }}
          path: dist/*.zip

  mobile:
    # mobile-launcher: APK (ký bằng khóa debug, chỉ để cài thử) và gói iOS Simulator.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: clients/feco-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter config --no-analytics
      - run: flutter pub get
      - name: Dựng APK
        if: runner.os == 'Linux'
        run: |
          version="${GITHUB_REF_NAME#v}"
          flutter build apk --release
          mkdir -p ../../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../../dist/feco-mobile-${version}.apk"
      - name: Dựng cho iOS Simulator
        if: runner.os == 'macOS'
        run: |
          version="${GITHUB_REF_NAME#v}"
          flutter build ios --simulator --debug
          mkdir -p ../../dist
          (cd build/ios/iphonesimulator && zip -qry "../../../../../dist/feco-mobile-${version}-ios-simulator.zip" Runner.app)
      - uses: actions/upload-artifact@v4
        with:
          name: feco-mobile-${{ matrix.os }}
          path: |
            dist/*.apk
            dist/*.zip

  mentor:
    # mentor-desktop-0.2.4: gói desktop Mentor tự chứa do tác giả dựng, ghim trong
    # integrations/mentor/DESKTOP_PACKAGE. Quét mã nguồn ở commit của tag, tải gói, kiểm SHA-256.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Lấy và kiểm gói Mentor
        run: integrations/mentor/fetch-desktop.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: mentor-desktop
          path: dist/*.zip

  release:
    needs: [build, mobile, mentor]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Tạo bản phát hành nháp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## "v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          (cd dist && sha256sum *.zip *.apk > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.apk dist/SHA256SUMS.txt \
            --draft --title "F-Eco $version" --notes-file notes.md
