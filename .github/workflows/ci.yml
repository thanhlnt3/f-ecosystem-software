name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # tasks.md 1.1: build và test cả workspace.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Diễn tập chuỗi tin cậy TUF bằng feco-tuf (tasks.md 5.1–5.3)
        shell: bash
        run: scripts/tuf-drill.sh

  licenses:
    # tasks.md 1.2 (license) và 1.3 (lỗ hổng phụ thuộc).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: License của dịch vụ và ảnh container (third_party/native.toml)
        run: cargo run -p feco-license-check
      - name: Cargo.lock khớp Cargo.toml (workflow release dựng bằng --locked)
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          cargo metadata --locked --format-version 1 --manifest-path clients/f-builder/Cargo.toml > /dev/null

  secrets:
    # tasks.md 1.3: chặn commit chứa bí mật.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  spec:
    # Bộ OpenSpec phải luôn hợp lệ.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y @fission-ai/openspec@1.16.1 validate --changes --strict --no-interactive

  sdk:
    # tasks.md 10.2: binding C, Python, TypeScript của F-SDK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: C ABI và app mẫu C
        run: |
          cargo build -p fsdk-c
          gcc -Wall -Werror sdk/c/examples/login.c -Isdk/c/include -Ltarget/debug -lfsdk_c -o target/debug/fsdk-login
          LD_LIBRARY_PATH=target/debug ./target/debug/fsdk-login --abi
      - name: Binding Python
        env:
          FSDK_LIBRARY: target/debug/libfsdk_c.so
        run: python -m unittest discover -s sdk/python/tests -v
      - name: Gói TypeScript
        working-directory: sdk/typescript
        run: node --test test/fsdk.test.ts

  f-builder:
    # tasks.md 11: F-Builder là Cargo workspace riêng trong clients/f-builder (edition 2024).
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      # Không ghi thông tin gỡ lỗi để bản dựng vừa đĩa của máy CI.
      CARGO_PROFILE_DEV_DEBUG: "0"
    defaults:
      run:
        working-directory: clients/f-builder
    steps:
      - uses: actions/checkout@v4
      - name: Giải phóng đĩa
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Thư viện hệ thống cho cửa sổ
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/f-builder
      - name: Kiểm tra của F-Builder (fmt, clippy, test, lớp, khóa, bí mật, bản dịch, wasm)
        run: cargo xtask ci
      - name: License và lỗ hổng phụ thuộc của F-Builder
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: clients/f-builder/Cargo.toml
          command: check

  infra:
    # tasks.md 1.4: hạ tầng dev khởi động được và các dịch vụ sẵn sàng.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Khởi động PostgreSQL, Valkey, Mailpit, Kratos, Hydra
        run: docker compose -f infra/docker-compose.yml up -d --wait --wait-timeout 180
      - name: Kiểm tra endpoint sức khỏe
        run: |
          curl -fsS http://127.0.0.1:4433/health/ready
          curl -fsS http://127.0.0.1:4444/health/ready
          curl -fsS http://127.0.0.1:4444/.well-known/openid-configuration | tee oidc.json
          grep -q '"pairwise"' oidc.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: App mẫu F-SDK và thư viện OIDC chuẩn cho E2E (tasks.md 10.2, 10.4)
        run: |
          python -m pip install "authlib>=1.3,<2" "requests>=2.31,<3"
          cargo build -p fsdk-c
          gcc sdk/c/examples/login.c -Isdk/c/include -Ltarget/debug -lfsdk_c -o target/debug/fsdk-login
      - name: E2E với Kratos, Hydra và Mailpit (tasks.md 2.1, 2.2, 3–10)
        env:
          FECO_E2E: "1"
          FECO_E2E_SDKS: "1"
          FSDK_C_EXAMPLE: ${{ github.workspace }}/target/debug/fsdk-login
        run: cargo test -p feco-server --test e2e_auth -- --nocapture
      - name: feco-server chạy và trả lời /healthz
        env:
          FECO_ENV: dev
          FECO_HTTP_ADDR: 127.0.0.1:8080
          FECO_DATABASE_URL: postgres://feco:feco-dev-only@127.0.0.1:5432/feco
        run: |
          cargo build -p feco-server
          ./target/debug/feco-server &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          exit 1
      - name: Nhật ký khi lỗi
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color --tail 200
