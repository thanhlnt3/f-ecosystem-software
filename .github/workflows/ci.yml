name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # tasks.md 1.1: build và test cả workspace.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Diễn tập chuỗi tin cậy TUF bằng feco-tuf (tasks.md 5.1–5.3)
        shell: bash
        run: scripts/tuf-drill.sh

  licenses:
    # tasks.md 1.2 (license) và 1.3 (lỗ hổng phụ thuộc).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: License của dịch vụ và ảnh container (third_party/native.toml)
        run: cargo run -p feco-license-check
      - name: Cargo.lock khớp Cargo.toml (workflow release dựng bằng --locked)
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          cargo metadata --locked --format-version 1 --manifest-path clients/f-builder/Cargo.toml > /dev/null

  secrets:
    # tasks.md 1.3: chặn commit chứa bí mật.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # tasks.md 1.3, bước xác minh (production-readiness): một kho thử có khóa giả phải bị gitleaks
      # chặn. Khóa được sinh ngẫu nhiên lúc chạy, không nằm trong repo.
      - name: gitleaks phải bắt được khóa giả
        run: |
          set -eu
          leak="$(mktemp -d)"
          git -C "$leak" init -q
          token="ghp_$(openssl rand -hex 18)"
          printf 'GITHUB_TOKEN=%s\n' "$token" > "$leak/config.env"
          git -C "$leak" -c user.email=ci@f-eco.test -c user.name=ci add config.env
          git -C "$leak" -c user.email=ci@f-eco.test -c user.name=ci commit -q -m "khoa gia"
          docker pull -q zricethezav/gitleaks:v8.21.2
          set +e
          docker run --rm -v "$leak:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --no-banner --exit-code 7
          code=$?
          set -e
          # 7: có rò rỉ; 0: không thấy gì; mã khác: gitleaks lỗi.
          if [ "$code" != 7 ]; then
            echo "gitleaks không chặn khóa giả (mã thoát $code)" >&2
            exit 1
          fi
          echo "gitleaks đã chặn khóa giả như mong đợi"

  spec:
    # Bộ OpenSpec phải luôn hợp lệ.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y @fission-ai/openspec@1.16.1 validate --changes --strict --no-interactive
      # tasks.md 15.1: mọi tài liệu có bản tiếng Anh đủ phần.
      - run: python3 scripts/check-docs-i18n.py

  sdk:
    # tasks.md 10.2: binding C, Python, TypeScript của F-SDK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: C ABI và app mẫu C
        run: |
          cargo build -p fsdk-c
          gcc -Wall -Werror sdk/c/examples/login.c -Isdk/c/include -Ltarget/debug -lfsdk_c -o target/debug/fsdk-login
          LD_LIBRARY_PATH=target/debug ./target/debug/fsdk-login --abi
      - name: Binding Python
        env:
          FSDK_LIBRARY: target/debug/libfsdk_c.so
        run: python -m unittest discover -s sdk/python/tests -v
      - name: Gói TypeScript
        working-directory: sdk/typescript
        run: node --test test/fsdk.test.ts

  f-builder:
    # tasks.md 11: F-Builder là Cargo workspace riêng trong clients/f-builder (edition 2024).
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      # Không ghi thông tin gỡ lỗi để bản dựng vừa đĩa của máy CI.
      CARGO_PROFILE_DEV_DEBUG: "0"
    defaults:
      run:
        working-directory: clients/f-builder
    steps:
      - uses: actions/checkout@v4
      - name: Giải phóng đĩa
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Thư viện hệ thống cho cửa sổ
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/f-builder
      - name: Kiểm tra của F-Builder (fmt, clippy, test, lớp, khóa, bí mật, bản dịch, wasm)
        run: cargo xtask ci
      - name: License và lỗ hổng phụ thuộc của F-Builder
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: clients/f-builder/Cargo.toml
          command: check

  infra:
    # tasks.md 1.4: hạ tầng dev khởi động được và các dịch vụ sẵn sàng.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Khởi động PostgreSQL, Valkey, Mailpit, Kratos, Hydra
        # docker-compose.e2e.yml: Kratos dùng mạng của máy và thêm nhà cung cấp OIDC giả của E2E
        # (thay đổi oidc-login-and-token-reuse).
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.e2e.yml up -d --wait --wait-timeout 180
      - name: Kiểm tra endpoint sức khỏe
        run: |
          curl -fsS http://127.0.0.1:4433/health/ready
          curl -fsS http://127.0.0.1:4444/health/ready
          curl -fsS http://127.0.0.1:4444/.well-known/openid-configuration | tee oidc.json
          grep -q '"pairwise"' oidc.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: App mẫu F-SDK và thư viện OIDC chuẩn cho E2E (tasks.md 10.2, 10.4)
        run: |
          python -m pip install "authlib>=1.3,<2" "requests>=2.31,<3"
          cargo build -p fsdk-c
          gcc sdk/c/examples/login.c -Isdk/c/include -Ltarget/debug -lfsdk_c -o target/debug/fsdk-login
      - name: E2E với Kratos, Hydra và Mailpit (tasks.md 2.1, 2.2, 3–10)
        env:
          FECO_E2E: "1"
          FECO_E2E_SDKS: "1"
          # Bắt buộc chạy E2E đăng nhập Google/GitHub với nhà cung cấp OIDC giả.
          FECO_E2E_OIDC: "1"
          FSDK_C_EXAMPLE: ${{ github.workspace }}/target/debug/fsdk-login
        run: cargo test -p feco-server --test e2e_auth --test e2e_chat --test e2e_source_scan -- --nocapture
      - name: feco-server chạy và trả lời /healthz
        env:
          FECO_ENV: dev
          FECO_HTTP_ADDR: 127.0.0.1:8080
          FECO_DATABASE_URL: postgres://feco:feco-dev-only@127.0.0.1:5432/feco
        run: |
          cargo build -p feco-server
          ./target/debug/feco-server &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          exit 1
      - name: Nhật ký khi lỗi
        if: failure()
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.e2e.yml logs --no-color --tail 200

  mobile-android:
    # mobile-launcher: F-Launcher di động trên Android 10 (API 29) và Android 16 (API 36).
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 36]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/feco-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter config --no-analytics
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Dựng APK
        run: flutter build apk --release
      - name: Bật KVM cho emulator
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Integration test trên Android emulator API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: clients/feco-mobile
          script: flutter test integration_test --dart-define=FECO_DEMO=true

  mobile-ios:
    # mobile-launcher: dựng với mục tiêu iOS 18 và chạy trên iOS Simulator của runner.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: clients/feco-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter config --no-analytics
      - run: flutter pub get
      - name: Dựng cho iOS Simulator (không ký)
        run: flutter build ios --simulator --debug
      - name: Integration test trên iOS Simulator
        # Lần chạy 44509620488: Simulator treo sau khi dựng xong, job chờ tới hạn 6 giờ của GitHub.
        # Mỗi lần thử tối đa 20 phút (perl alarm, macOS không có `timeout`), cả bước tối đa 60 phút.
        timeout-minutes: 60
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,v in sorted(d.items(), reverse=True) if 'iOS' in r for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$udid"
          # Chờ Simulator khởi động xong hẳn: nếu không, lần mở app đầu có thể hết hạn kết nối
          # tới VM Service.
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl list devices booted
          run_once() { perl -e 'alarm shift; exec @ARGV' 1200 flutter test integration_test -d "$udid" --dart-define=FECO_DEMO=true; }
          run_once || run_once

  integration-scan:
    # chat-and-source-scan (design S3): quét lại mọi app bên ngoài đã tích hợp ở đúng commit đã ghi
    # (Mentor: MENTOR_COMMIT; ThesisAI: bảng commit trong README). Có phát hiện critical chưa được
    # cho phép trong integrations/<app>/scan-allow.toml thì job thất bại (scenario "Commit mới có bí
    # mật"). Báo cáo Markdown được đính kèm làm artifact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Quét Mentor và ThesisAI
        run: scripts/scan-integrations-all.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-scan
          path: .dev/scans/*/scan-report.md
          retention-days: 30

  binhai-office:
    # binhai-office-integration: dựng BinhAI Office từ mã nguồn ở commit trong README (npm ci
    # --ignore-scripts, npm run build) và kiểm bản tự dựng trùng từng tệp với app/dist của tác giả.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dựng BinhAI Office và so với bản dựng sẵn
        run: integrations/binhai-office/build.sh "$RUNNER_TEMP/binhai-site" --verify-dist

  vpdf:
    # vpdf-integration: dựng VPdf (Windows x64) từ mã nguồn ở tag và commit trong README, với PDFium
    # và qpdf tải theo SHA-256 ghim trong scripts/fetch-native.sh của VPdf; kiểm gói đủ tệp chạy,
    # DLL và giấy phép. Gói được đính kèm làm artifact.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dựng gói VPdf
        run: |
          integrations/vpdf/build.sh "$RUNNER_TEMP/vpdf-pkg"
          for f in vpdf-app.exe pdfium.dll qpdf30.dll licenses/LICENSE-MIT licenses/LICENSE-APACHE \
                   licenses/pdfium/LICENSE licenses/license-exceptions.toml licenses/F-ECO-NOTICE.md; do
            test -f "$RUNNER_TEMP/vpdf-pkg/$f" || { echo "gói thiếu $f" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: vpdf-windows-x64-ci
          path: ${{ runner.temp }}/vpdf-pkg
          retention-days: 7

  thesisai-fe:
    # Bản vá thesisai-fe (đăng nhập F-Eco, Next.js 16.4.6 đã vá GHSA-2464-fhr4-w9xw và
    # GHSA-673q-mjm6-r5xr, QUESTIONS.md 109) còn áp được lên commit trong README và dựng được.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Áp bản vá và dựng thesisai-fe
        run: |
          set -eu
          read -r repo commit <<< "$(sed -nE 's#.*https://github\.com/([A-Za-z0-9_.-]+/thesisai-fe) \| `([0-9a-f]{40})`.*#\1 \2#p' integrations/thesisai/README.md)"
          git init -q "$RUNNER_TEMP/fe"
          cd "$RUNNER_TEMP/fe"
          git fetch -q --depth 1 "https://github.com/$repo.git" "$commit"
          git checkout -q FETCH_HEAD
          git apply "$GITHUB_WORKSPACE/integrations/thesisai/thesisai-fe.patch"
          test "$(node -p 'require("./package.json").dependencies.next')" = 16.4.6
          npm ci --no-audit --no-fund
          npx next build

  mentor-desktop:
    # mentor-integration: bản vá Mentor còn áp được lên commit đã ghi, test của Mentor qua, dựng được
    # app desktop Windows (scenario "Bản vá còn áp được").
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@9.15.9
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Áp bản vá, test và dựng Mentor
        run: integrations/mentor/build-desktop.sh dist "0.0.0-ci"
      - uses: actions/upload-artifact@v4
        with:
          name: mentor-desktop-ci
          path: dist/*.zip
          retention-days: 7
